<?xml version="1.0" encoding="UTF-8"?>
<!-- Audio-quality mark: a four-point spark, tips on the axes and the waist
     drawn in on the diagonals. Straight edges only, so it reads as digital
     rather than organic, and sharp tips to match the rest of the UI (square
     throughout, see UI_DESIGN_SYSTEM.md §1.3).

     Its meaning lives entirely in the DRAW-TIME COLOUR (the quality tier);
     the shape and size never vary, so it can never read as comparative.

     Outlined, not solid: filled, a full-chroma yellow or cyan star shouted
     against a palette of near-black, greys and one green. Hollowing it drops
     ~30% of the ink while keeping the tier legible.

     The cut-out is the same profile at 55%. That number is the wall, and the
     wall is what has to survive: at its narrowest (the waist) it measures 3.8
     of these 36 units, which is 5.1 texels in the 0.5 em glyph's 48px atlas
     cell — comfortably representable. Hollowing further (70%+) would thin it
     toward a single texel, where a lone bilinear tap under minification
     smears it away. Widen the wall before touching the design box: a bigger
     box makes minification WORSE, not better (see build_icon_font.py).

     Two closed concave contours, neither self-intersecting and one fully
     nested in the other: this build runs msdfgen with MSDFGEN_USE_SKIA=OFF,
     which has no overlap resolver, so crossing arms would tear at the seams.
     Nesting is fine and needs no special handling — orientContours() reads
     the cut-out from scanline parity, exactly as warning.svg's "!" does. -->
<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <path d="M18,2 L24,12 L34,18 L24,24 L18,34 L12,24 L2,18 L12,12 Z
           M18,9.2 L21.3,14.7 L26.8,18 L21.3,21.3 L18,26.8 L14.7,21.3 L9.2,18 L14.7,14.7 Z"/>
</svg>
